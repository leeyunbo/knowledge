<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git — 지식 요람</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117; --bg2: #1a1d27; --bg3: #22263a;
      --border: #2e3250; --accent: #7c6af7; --accent2: #a78bfa;
      --accent3: #38bdf8; --text: #e2e8f0; --text2: #94a3b8;
      --text3: #64748b; --green: #34d399;
      --radius: 12px;
      --font: 'Pretendard', -apple-system, sans-serif;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font); line-height: 1.75; min-height: 100vh; }
    .container { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem 6rem; }
    .breadcrumb { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--text3); margin-bottom: 2.5rem; }
    .breadcrumb a { color: var(--text3); text-decoration: none; transition: color 0.2s; }
    .breadcrumb a:hover { color: var(--accent2); }
    .breadcrumb .sep { color: var(--border); }
    h1 {
      font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--text) 0%, var(--accent2) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle { color: var(--text3); font-size: 0.9rem; margin-bottom: 2.5rem; }
    .chapter-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .chapter-item {
      display: flex; align-items: center; gap: 1rem;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.25rem 1.5rem;
      text-decoration: none; color: var(--text);
      transition: all 0.2s;
    }
    .chapter-item:hover { border-color: var(--accent); transform: translateX(4px); }
    .chapter-item .icon { font-size: 1.5rem; flex-shrink: 0; }
    .chapter-item .content { flex: 1; }
    .chapter-item .title { font-weight: 600; font-size: 1.05rem; margin-bottom: 0.25rem; }
    .chapter-item .count { font-size: 0.8rem; color: var(--text3); }
    .chapter-item .arrow { color: var(--text3); transition: color 0.2s; font-size: 1.2rem; }
    .chapter-item:hover .arrow { color: var(--accent2); }
    .badge {
      display: inline-flex; align-items: center; gap: 0.3rem;
      background: rgba(124,106,247,0.15); border: 1px solid rgba(124,106,247,0.3);
      color: var(--accent2); border-radius: 16px;
      padding: 0.15rem 0.5rem; font-size: 0.7rem; font-weight: 600;
    }
    @media (max-width: 640px) {
      .container { padding: 1.5rem 1rem 4rem; }
      .chapter-item { padding: 1rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <nav class="breadcrumb">
      <a href="/knowledge/index.html">📚 지식 요람</a>
      <span class="sep">›</span>
      <span>Git</span>
    </nav>
    <h1>🔀 Git</h1>
    <p class="subtitle">버전 관리 시스템의 모든 것</p>
    <div class="chapter-list">
      <a href="기본-명령어/index.html" class="chapter-item">
        <span class="icon">📂</span>
        <div class="content">
          <div class="title">기본 명령어</div>
          <div class="count"><span class="badge">💡 1</span> 개의 메모</div>
        </div>
        <span class="arrow">›</span>
      </a>
    </div>
  </div>
</body>
</html>
