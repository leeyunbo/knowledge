    .cs-container { max-width: 1080px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
    .cs-hero { margin-bottom: 2.5rem; }
    .cs-hero h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; color: var(--text); }

    .galaxy-canvas { position: relative; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem 1.25rem 1rem; margin-bottom: 3.5rem; }
    .galaxy-meta { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 0.85rem; font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .galaxy-svg { display: block; width: 100%; max-width: 1000px; margin: 0 auto; height: auto; }

    .category-label { font-size: 12px; font-weight: 700; fill: var(--text); letter-spacing: -0.01em; pointer-events: none; }
    .category-label-meta { font-size: 10px; fill: var(--text-muted); font-family: var(--font-mono); pointer-events: none; }
    .category-bg { pointer-events: none; fill: var(--text); fill-opacity: 0.025; }

    .node-label-done {
      font-size: 10px;
      font-weight: 600;
      fill: var(--text);
      text-anchor: middle;
      pointer-events: none;
      paint-order: stroke;
      stroke: var(--bg-card);
      stroke-width: 3px;
      stroke-linejoin: round;
    }
    .node-label-all {
      font-size: 9px;
      font-weight: 500;
      fill: var(--text-faint);
      text-anchor: middle;
      pointer-events: none;
      paint-order: stroke;
      stroke: var(--bg-card);
      stroke-width: 2.5px;
      stroke-linejoin: round;
    }


    .link { stroke: var(--border); stroke-width: 1; fill: none; transition: stroke 0.4s ease, opacity 0.4s ease; opacity: 0; animation: linkIn 1s ease-out forwards; animation-delay: 1.2s; }
    @keyframes linkIn { to { opacity: 0.6; } }

    .node { cursor: pointer; opacity: 0; animation: nodeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards; transform-box: fill-box; transform-origin: center; }
    @keyframes nodeIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }

    .node-circle { transition: transform 0.3s ease, stroke 0.3s ease; transform-box: fill-box; transform-origin: center; }
    .node-ring { fill: none; opacity: 0; pointer-events: none; }

    .node[data-state="locked"] .node-circle { fill: var(--surface); stroke: var(--border-strong); stroke-width: 1.3; }
    .node[data-state="locked"] { cursor: pointer; }

    .node[data-state="done"] .node-circle { fill: var(--node-color); stroke: var(--node-color); stroke-width: 1.2; }
    .node[data-state="done"] .node-ring { stroke: var(--node-color); stroke-width: 1.2; opacity: 0.3; animation: ringPulse 4s ease-in-out infinite; animation-delay: var(--ring-delay, 0s); }
    @keyframes ringPulse { 0%, 100% { r: 8; opacity: 0.3; } 50% { r: 13; opacity: 0; } }

    .node:hover .node-circle { transform: scale(1.4); }
    .galaxy-svg.hovering .node:not(.is-active) { opacity: 0.2; transition: opacity 0.3s ease; }

    .group-A, .group-B, .group-C, .group-D, .group-E, .group-F, .group-G { --node-color: var(--text); }

    .tooltip { position: fixed; background: var(--text); color: var(--surface); padding: 8px 12px; border-radius: 6px; font-size: 12px; max-width: 280px; pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity 0.2s ease, transform 0.2s ease; z-index: 100; }
    .tooltip.show { opacity: 1; transform: translateY(0); }
    .tooltip-title { font-weight: 600; margin-bottom: 3px; font-size: 12.5px; }
    .tooltip-desc { color: var(--surface); opacity: 0.75; font-size: 11px; line-height: 1.5; }
    .tooltip-cat { color: var(--surface); opacity: 0.5; font-size: 10px; margin-top: 4px; font-family: var(--font-mono); }

    /* === 카테고리 카드 (모바일 fallback) === */
    .category-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .category-card { display: block; padding: 1.5rem 1.25rem; background: var(--bg-card); border: 1px solid var(--border); border-left: 3px solid var(--card-color); border-radius: 8px; text-decoration: none; color: inherit; transition: border-color 0.2s ease, transform 0.2s ease; }
    .category-card:hover { border-color: var(--border-hover); transform: translateY(-1px); }
    .category-card { --card-color: var(--text); }

    .category-card h2 { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 0.4rem; letter-spacing: -0.01em; }
    .category-card .cat-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 1rem; line-height: 1.5; }
    .progress-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-faint); font-family: var(--font-mono); font-variant-numeric: tabular-nums; margin-bottom: 0.4rem; }
    .progress-bar { height: 4px; background: var(--border); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--card-color); border-radius: 999px; transition: width 0.6s ease; }

    /* === FILTER CHIPS === */
    .cs-filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 1.5rem; }
    .cs-chip {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 500;
      padding: 5px 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .cs-chip:hover { color: var(--text); border-color: var(--border-strong); }
    .cs-chip .ct { font-size: 10.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
    .cs-chip.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }
    .cs-chip.active .ct { color: var(--bg); opacity: 0.65; }

    /* === FILTERED STATE === */
    .galaxy-svg .node.is-dimmed,
    .galaxy-svg .link.is-dimmed,
    .galaxy-svg .category-bg.is-dimmed,
    .galaxy-svg .category-label.is-dimmed,
    .galaxy-svg .category-label-meta.is-dimmed {
      opacity: 0.12;
      transition: opacity 0.25s ease;
    }
    .galaxy-svg .node:not(.is-dimmed),
    .galaxy-svg .link:not(.is-dimmed) {
      transition: opacity 0.25s ease;
    }

    @media (max-width: 768px) {
      .cs-container { padding: 2rem 1rem 3rem; }
      .cs-hero h1 { font-size: 24px; }
      .galaxy-canvas { display: none; }
      .cs-filter-row { display: none; }
      .category-grid { grid-template-columns: 1fr; }
    }
  </style>

    document.querySelectorAll('.node[data-state="locked"]').forEach(node => {
      const g = node.querySelector('g');
      const title = node.dataset.title;
      const label = shortLabels[title] || title;
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('class', 'node-label-all');
      text.setAttribute('y', '22');
      text.textContent = label;
      g.appendChild(text);
    });

    document.querySelectorAll('.node').forEach((n, i) => { n.style.animationDelay = (0.5 + i * 0.015) + 's'; });

    const svg = document.querySelector('.galaxy-svg');
    const tooltip = document.getElementById('tooltip');
    const tooltipTitle = document.getElementById('tooltipTitle');
    const tooltipDesc = document.getElementById('tooltipDesc');
    const tooltipCat = document.getElementById('tooltipCat');

    document.querySelectorAll('.node').forEach(node => {
      node.addEventListener('mouseenter', () => {
        svg.classList.add('hovering');
        node.classList.add('is-active');
        tooltipTitle.textContent = node.dataset.title;
        tooltipDesc.textContent = node.dataset.desc;
        tooltipCat.textContent = node.dataset.cat;
        tooltip.classList.add('show');
      });
      node.addEventListener('mouseleave', () => {
        svg.classList.remove('hovering');
        node.classList.remove('is-active');
        tooltip.classList.remove('show');
      });
      node.addEventListener('mousemove', (e) => {
        tooltip.style.left = Math.min(e.clientX + 14, window.innerWidth - 300) + 'px';
        tooltip.style.top = Math.min(e.clientY + 14, window.innerHeight - 100) + 'px';
      });
    });

    // 진행률 자동 계산
    const total = document.querySelectorAll('.node').length;
    const done = document.querySelectorAll('.node[data-state="done"]').length;
    document.getElementById('totalText').textContent = done + ' / ' + total;
    document.getElementById('totalPct').textContent = Math.round((done / total) * 100) + '%';

    // 카테고리 필터
    const catToGroup = {
      'Java': 'A',
      'Spring': 'B',
      'DB': 'C',
      '네트워크': 'D',
      '동시성': 'E',
      '분산 시스템 설계': 'F',
      '보안': 'G'
    };
    const allChips = document.querySelectorAll('.cs-chip');
    function applyFilter(filter) {
      allChips.forEach(c => c.classList.toggle('active', c.dataset.filter === filter));
      const isAll = !filter || filter === 'all';
      const group = catToGroup[filter];
      document.querySelectorAll('.galaxy-svg .node').forEach(n => {
        n.classList.toggle('is-dimmed', !isAll && n.dataset.cat !== filter);
      });
      document.querySelectorAll('.galaxy-svg .link').forEach(l => {
        l.classList.toggle('is-dimmed', !isAll);
      });
      document.querySelectorAll('.galaxy-svg .category-bg').forEach(el => {
        const matches = group && el.classList.contains('bg-' + group);
        el.classList.toggle('is-dimmed', !isAll && !matches);
      });
      document.querySelectorAll('.galaxy-svg .category-label, .galaxy-svg .category-label-meta').forEach(el => {
        const cls = (el.getAttribute('data-group') || '').toUpperCase();
        const matches = group && cls === group;
        el.classList.toggle('is-dimmed', !isAll && !matches);
      });
    }
    allChips.forEach(chip => {
      chip.addEventListener('click', () => applyFilter(chip.dataset.filter));
    });
