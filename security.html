<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보안 · bok's notes</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="./assets/style.css">
  <style>
    .topic-container { max-width: 1080px; margin: 0 auto; padding: 2.5rem 1.5rem 5rem; }
    .topic-hero { margin-bottom: 2.5rem; }
    .topic-hero h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.02em; color: var(--text); }
    .graph-canvas { position: relative; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 2rem 1.5rem 1.5rem; margin-bottom: 3.5rem; }
    .graph-meta { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 1.25rem; font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .graph-svg { display: block; width: 100%; max-width: 700px; margin: 0 auto; height: auto; }

    .link { stroke: var(--border); stroke-width: 1; fill: none; transition: stroke 0.4s ease, opacity 0.4s ease; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: drawLine 1.4s ease-out forwards; animation-delay: 0.7s; }
    @keyframes drawLine { to { stroke-dashoffset: 0; } }

    .node { cursor: pointer; opacity: 0; animation: nodeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards; transform-box: fill-box; transform-origin: center; }
    @keyframes nodeIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }

    .node-circle { transition: transform 0.3s ease, stroke 0.3s ease; transform-box: fill-box; transform-origin: center; }
    .node-ring { fill: none; opacity: 0; pointer-events: none; }
    .node-label { font-size: 11px; font-weight: 500; text-anchor: middle; pointer-events: none; fill: var(--text); transition: fill 0.3s ease; }

    .node[data-state="locked"] .node-circle { fill: #ffffff; stroke: var(--border); stroke-width: 1.5; }
    .node[data-state="locked"] .node-label { fill: var(--text-faint); }
    .node[data-state="locked"] { cursor: default; }

    .node[data-state="done"] .node-circle { fill: var(--node-color); stroke: var(--node-color); stroke-width: 1.5; }
    .node[data-state="done"] .node-ring { stroke: var(--node-color); stroke-width: 1.5; opacity: 0.35; animation: ringPulse 4s ease-in-out infinite; animation-delay: var(--ring-delay, 0s); }
    @keyframes ringPulse { 0%, 100% { r: 12; opacity: 0.35; } 50% { r: 18; opacity: 0; } }

    .node[data-state="done"]:hover .node-circle { transform: scale(1.25); }
    .graph-svg.hovering .node:not(.is-active) { opacity: 0.25; transition: opacity 0.3s ease; }
    .graph-svg.hovering .link:not(.is-active) { opacity: 0.1; }
    .graph-svg.hovering .link.is-active { stroke: var(--text-muted); opacity: 1; }

    .group-A { --node-color: #6366f1; }
    .group-B { --node-color: #ec4899; }

    .tooltip { position: fixed; background: var(--text); color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 12px; max-width: 280px; pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity 0.2s ease, transform 0.2s ease; z-index: 100; }
    .tooltip.show { opacity: 1; transform: translateY(0); }
    .tooltip-title { font-weight: 600; margin-bottom: 3px; font-size: 12.5px; }
    .tooltip-desc { color: rgba(255,255,255,0.75); font-size: 11px; line-height: 1.5; }

    .group-list { margin-top: 3rem; }
    .group-section { margin-bottom: 2rem; border-left: 3px solid var(--group-color); padding-left: 1.25rem; }
    .group-section.group-A { --group-color: #6366f1; }
    .group-section.group-B { --group-color: #ec4899; }
    .group-section h2 { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 0.3rem; letter-spacing: -0.01em; }
    .group-section .group-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 1rem; line-height: 1.5; }

    .topic-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .topic-item { display: flex; align-items: baseline; gap: 0.6rem; padding: 0.55rem 0.75rem; border-radius: 6px; background: var(--bg-card); border: 1px solid var(--border); text-decoration: none; color: inherit; transition: border-color 0.2s ease; }
    .topic-item:hover { border-color: var(--border-hover); }
    .topic-item.locked { opacity: 0.55; cursor: default; }
    .topic-item.locked:hover { border-color: var(--border); }
    .topic-num { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); min-width: 1.4rem; font-variant-numeric: tabular-nums; }
    .topic-title { flex: 1; font-size: 13px; font-weight: 500; color: var(--text); }
    .topic-meta { font-size: 11px; color: var(--text-faint); font-family: var(--font-mono); }

    @media (max-width: 768px) {
      .topic-container { padding: 2rem 1rem 3rem; }
      .topic-hero h1 { font-size: 24px; }
      .graph-canvas { display: none; }
      .group-list { margin-top: 1.5rem; }
      .group-section { padding-left: 1rem; margin-bottom: 1.5rem; }
    }
  </style>
</head>
<body>

  <main class="topic-container">
    <section class="topic-hero">
      <h1>보안</h1>
    </section>

    <section class="graph-canvas">
      <div class="graph-meta">
        <span><span id="progressText">2 / 5</span> · <span id="progressPct">40%</span></span>
      </div>

      <svg class="graph-svg" viewBox="0 0 600 380" xmlns="http://www.w3.org/2000/svg" aria-label="보안 토픽 그래프">
        <g id="links">
          <line class="link" data-from="1" data-to="2" x1="180" y1="120" x2="280" y2="220" />
          <line class="link" data-from="1" data-to="3" x1="180" y1="120" x2="80"  y2="220" />
          <line class="link" data-from="2" data-to="3" x1="280" y1="220" x2="80"  y2="220" />
          <line class="link" data-from="4" data-to="5" x1="450" y1="140" x2="450" y2="280" />
          <line class="link" data-from="5" data-to="2" x1="450" y1="280" x2="280" y2="220" />
        </g>

        <a class="node group-A" data-state="locked" data-id="1" data-title="OAuth 2.0 / OIDC" data-desc="Authorization Code, PKCE, ID Token, refresh flow" href="#">
          <g transform="translate(180,120)"><circle class="node-ring" /><circle class="node-circle" r="10" /><text class="node-label" y="26">OAuth · OIDC</text></g>
        </a>
        <a class="node group-A" data-state="done" data-id="2" data-title="JWT 구조와 함정" data-desc="header.payload.signature, 무효화 어떻게, 키 회전" href="./posts/2026-05-인증-session-jwt/03-jwt-구조.html">
          <g transform="translate(280,220)" style="--ring-delay: 0.5s;"><circle class="node-ring" /><circle class="node-circle" r="10" /><text class="node-label" y="26">JWT</text></g>
        </a>
        <a class="node group-A" data-state="done" data-id="3" data-title="Session vs JWT" data-desc="언제 어느 것을 쓰는가, 트레이드오프 정리" href="./posts/2026-05-인증-session-jwt/01-http-stateless와-인증.html">
          <g transform="translate(80,220)" style="--ring-delay: 1.0s;"><circle class="node-ring" /><circle class="node-circle" r="10" /><text class="node-label" y="26">Session vs JWT</text></g>
        </a>

        <a class="node group-B" data-state="locked" data-id="4" data-title="CSRF / XSS / SQL Injection 방어" data-desc="OWASP Top 10 핵심 셋, 방어 패턴" href="#">
          <g transform="translate(450,140)"><circle class="node-ring" /><circle class="node-circle" r="10" /><text class="node-label" y="26">CSRF · XSS · SQLi</text></g>
        </a>
        <a class="node group-B" data-state="locked" data-id="5" data-title="HTTPS / 인증서 체인" data-desc="CA 체인 검증, mTLS, 인증서 만료/회전" href="#">
          <g transform="translate(450,280)"><circle class="node-ring" /><circle class="node-circle" r="10" /><text class="node-label" y="26">HTTPS · 인증서</text></g>
        </a>
      </svg>
    </section>

    <section class="group-list">
      <div class="group-section group-A">
        <h2>A · 인증 / 인가</h2>
        <p class="group-desc">로그인부터 토큰까지, 사용자를 식별하는 방법</p>
        <div class="topic-list">
          <div class="topic-item locked"><span class="topic-num">01</span><span class="topic-title">OAuth 2.0 / OIDC</span><span class="topic-meta">예정</span></div>
          <a class="topic-item done" href="./posts/2026-05-인증-session-jwt/03-jwt-구조.html">
            <span class="topic-num">02</span><span class="topic-title">JWT 구조와 함정</span><span class="topic-meta">2편</span>
          </a>
          <a class="topic-item done" href="./posts/2026-05-인증-session-jwt/01-http-stateless와-인증.html">
            <span class="topic-num">03</span><span class="topic-title">Session vs JWT</span><span class="topic-meta">3편</span>
          </a>
        </div>
      </div>

      <div class="group-section group-B">
        <h2>B · 웹 보안</h2>
        <p class="group-desc">공격 표면을 줄이는 기본 방어</p>
        <div class="topic-list">
          <div class="topic-item locked"><span class="topic-num">04</span><span class="topic-title">CSRF / XSS / SQL Injection 방어</span><span class="topic-meta">예정</span></div>
          <div class="topic-item locked"><span class="topic-num">05</span><span class="topic-title">HTTPS / 인증서 체인</span><span class="topic-meta">예정</span></div>
        </div>
      </div>
    </section>
  </main>

  <div class="tooltip" id="tooltip">
    <div class="tooltip-title" id="tooltipTitle"></div>
    <div class="tooltip-desc" id="tooltipDesc"></div>
  </div>

  <footer class="site-footer">bok · 2026</footer>

  <script>
    document.querySelectorAll('.node').forEach((n, i) => { n.style.animationDelay = (i * 0.05) + 's'; });
    const links = document.querySelectorAll('.link');
    const adjacency = {};
    links.forEach(link => {
      const from = link.dataset.from, to = link.dataset.to;
      if (!adjacency[from]) adjacency[from] = new Set();
      if (!adjacency[to]) adjacency[to] = new Set();
      adjacency[from].add(to); adjacency[to].add(from);
    });
    const svg = document.querySelector('.graph-svg');
    const tooltip = document.getElementById('tooltip');
    const tooltipTitle = document.getElementById('tooltipTitle');
    const tooltipDesc = document.getElementById('tooltipDesc');
    document.querySelectorAll('.node').forEach(node => {
      node.addEventListener('mouseenter', () => {
        const id = node.dataset.id, connected = adjacency[id] || new Set();
        svg.classList.add('hovering');
        document.querySelectorAll('.node').forEach(n => {
          if (n.dataset.id === id || connected.has(n.dataset.id)) n.classList.add('is-active');
        });
        document.querySelectorAll('.link').forEach(link => {
          if ((link.dataset.from === id && connected.has(link.dataset.to)) || (link.dataset.to === id && connected.has(link.dataset.from))) link.classList.add('is-active');
        });
        tooltipTitle.textContent = node.dataset.title;
        tooltipDesc.textContent = node.dataset.desc;
        tooltip.classList.add('show');
      });
      node.addEventListener('mouseleave', () => {
        svg.classList.remove('hovering');
        document.querySelectorAll('.is-active').forEach(el => el.classList.remove('is-active'));
        tooltip.classList.remove('show');
      });
      node.addEventListener('mousemove', (e) => {
        tooltip.style.left = Math.min(e.clientX + 14, window.innerWidth - 300) + 'px';
        tooltip.style.top = Math.min(e.clientY + 14, window.innerHeight - 80) + 'px';
      });
      if (node.dataset.state === 'locked') node.addEventListener('click', (e) => e.preventDefault());
    });
    const total = document.querySelectorAll('.node').length;
    const done = document.querySelectorAll('.node[data-state="done"]').length;
    document.getElementById('progressText').textContent = done + ' / ' + total;
    document.getElementById('progressPct').textContent = Math.round((done / total) * 100) + '%';
  </script>
</body>
</html>
