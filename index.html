<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bok's notes</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="./assets/style.css">
  <style>
    html, body { min-height: 100vh; }
    body { display: flex; flex-direction: column; }

    .splash-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 3rem 2rem;
      box-sizing: border-box;
    }

    .splash-hero {
      margin-bottom: 4rem;
    }
    .splash-hero h1 {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--text);
    }

    .entry-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    .entry-card {
      display: block;
      padding: 3rem 2.25rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s ease, transform 0.2s ease;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .entry-card:hover {
      border-color: var(--text);
      transform: translateY(-3px);
    }
    .entry-card h2 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 0.6rem;
      letter-spacing: -0.015em;
    }
    .entry-card p {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.55;
    }

    @media (max-width: 640px) {
      .splash-container { padding: 2rem 1.25rem; justify-content: flex-start; padding-top: 4rem; }
      .splash-hero { margin-bottom: 2rem; }
      .splash-hero h1 { font-size: 28px; }
      .entry-grid { grid-template-columns: 1fr; gap: 0.75rem; }
      .entry-card { padding: 1.75rem 1.5rem; min-height: 130px; }
      .entry-card h2 { font-size: 18px; }
      .entry-card p { font-size: 13px; }
    }
  </style>
</head>
<body>

  <main class="splash-container">
    <section class="splash-hero">
      <h1>bok's notes</h1>
    </section>

    <section class="entry-grid">
      <a href="./cs.html" class="entry-card">
        <h2>CS</h2>
        <p>기술 면접을 대비한 CS 정리</p>
      </a>
      <a href="./narrative.html" class="entry-card">
        <h2>실무에서 고민한 것들</h2>
        <p>내가 풀어간 문제들</p>
      </a>
    </section>
  </main>

  <footer class="site-footer">
    bok · 2026
  </footer>
</body>
</html>
</content>
