{%- assign root = rootPath | default: "./" -%}
<header class="site-header">
  <div class="site-header-inner">
    <a class="site-brand" href="{{ root }}index.html">
      <span class="site-brand-dot" aria-hidden="true"></span>
      <span class="site-brand-name">bok's notes</span>
    </a>
    <button class="site-nav-toggle" type="button" id="navToggle" aria-label="메뉴" aria-expanded="false" aria-controls="siteNav">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>
    <nav class="site-nav" id="siteNav">
      <a href="{{ root }}cs.html">cs</a>
      <a href="{{ root }}narrative.html">개발 노트</a>
      <a href="{{ root }}reading.html">읽은 글</a>
      <button class="site-nav-cmdk" type="button" id="cmdkTrigger" aria-label="검색 (⌘K)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <kbd>⌘K</kbd>
      </button>
      <button class="site-nav-theme" type="button" id="themeToggle" aria-label="테마 토글">
        <svg class="icon-light" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-dark" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
      </button>
      <a href="https://github.com/leeyunbo" target="_blank" rel="noopener">github</a>
    </nav>
  </div>
</header>
{% include "cmdk.html" %}
<script>
(function() {
  var themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.addEventListener('click', function() {
      var isDark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('bok:theme', isDark ? 'dark' : 'light'); } catch (e) {}
    });
  }
  var navBtn = document.getElementById('navToggle');
  var nav = document.getElementById('siteNav');
  if (navBtn && nav) {
    navBtn.addEventListener('click', function() {
      var open = nav.classList.toggle('open');
      navBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      navBtn.classList.toggle('open', open);
    });
    document.addEventListener('click', function(e) {
      if (!nav.classList.contains('open')) return;
      if (e.target === navBtn || navBtn.contains(e.target)) return;
      if (nav.contains(e.target)) return;
      nav.classList.remove('open');
      navBtn.classList.remove('open');
      navBtn.setAttribute('aria-expanded', 'false');
    });
  }
})();
</script>
